name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . numpy   # numpy: iteration_worker tests
      - name: CPU contract tests (device tests skip without hardware)
        run: python -m unittest discover -s tests -v
