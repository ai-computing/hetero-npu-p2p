[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hetero-npu-p2p"
version = "0.6.0"
description = "Experimental completion-fenced same-host heterogeneous NPU KV transport"
requires-python = ">=3.10"
dependencies = ["rm-core @ git+https://github.com/ai-computing/rm-core@v0.1.1"]

[project.scripts]
hetero-p2p = "hetero_p2p.cli:main"

[project.entry-points."airm.kv_transports"]
p2p = "hetero_p2p.airm:P2PTransport"

[tool.setuptools.packages.find]
where = ["src"]
