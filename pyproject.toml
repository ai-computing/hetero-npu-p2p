[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hetero-npu-p2p"
version = "0.4.0"
description = "Experimental completion-fenced same-host heterogeneous NPU KV transport"
requires-python = ">=3.10"

[project.scripts]
hetero-p2p = "hetero_p2p.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
